[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis"
version = "0.1.0"
description = "Project Aegis: Detection-Gated, Layer-Selective Restore for Radiation-Resilient Onboard Neural Networks"
readme = "AEGIS_RESEARCH_STUDY_AND_PROTOTYPE_BLUEPRINT.md"
requires-python = ">=3.10"
authors = [
    { name = "Project Aegis Research Team" }
]
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "safetensors>=0.4.0",
    "zstandard>=0.20.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "huggingface_hub>=0.20.0",
    "streamlit>=1.30.0",
    "matplotlib>=3.7.0",
    "sgp4>=2.20",
    "ppigrf>=2.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
filterwarnings = [
    "ignore::UserWarning",
    "ignore::DeprecationWarning"
]
